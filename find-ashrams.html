  <style>
    /* ══════════════════════════════════════════════════════════
       BASE + ANIMATED BACKGROUND
       ══════════════════════════════════════════════════════════ */
    body {
      background:
        radial-gradient(1200px 600px at 8% -10%, rgba(16,185,129,.10), transparent 60%),
        radial-gradient(900px 500px at 100% 5%, rgba(139,92,246,.08), transparent 60%),
        radial-gradient(800px 500px at 50% 110%, rgba(245,158,11,.07), transparent 60%),
        #f6f9fc;
      background-attachment: fixed;
      position: relative;
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed; inset: -40%;
      background:
        radial-gradient(600px 600px at 20% 30%, rgba(16,185,129,.06), transparent 60%),
        radial-gradient(600px 600px at 80% 70%, rgba(37,99,235,.05), transparent 60%);
      animation: ffAurora 24s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 0;
    }
    @keyframes ffAurora {
      0%   { transform: translate3d(0,0,0) rotate(0deg) scale(1); }
      50%  { transform: translate3d(2%,-2%,0) rotate(6deg) scale(1.05); }
      100% { transform: translate3d(-2%,2%,0) rotate(-6deg) scale(1.1); }
    }
    main, header.site-header, footer.site-footer { position: relative; z-index: 1; }

    /* Floating decorative orbs */
    .ff-orb {
      position: fixed;
      width: 420px; height: 420px;
      border-radius: 50%;
      filter: blur(80px);
      opacity: .35;
      pointer-events: none;
      z-index: 0;
    }
    .ff-orb.o1 { background: radial-gradient(circle, #34d399, transparent 65%); top: -140px; left: -160px; animation: ffOrbA 22s ease-in-out infinite alternate; }
    .ff-orb.o2 { background: radial-gradient(circle, #a78bfa, transparent 65%); top: 20%; right: -180px; animation: ffOrbB 26s ease-in-out infinite alternate; }
    .ff-orb.o3 { background: radial-gradient(circle, #fbbf24, transparent 65%); bottom: -180px; left: 30%; animation: ffOrbA 30s ease-in-out infinite alternate-reverse; }
    @keyframes ffOrbA { 0%{transform:translate(0,0) scale(1);} 100%{transform:translate(60px,40px) scale(1.15);} }
    @keyframes ffOrbB { 0%{transform:translate(0,0) scale(1);} 100%{transform:translate(-70px,60px) scale(1.2);} }

    /* Floating particles */
    @keyframes ffFloatUp{
      0%   { transform: translateY(105vh) scale(.4) rotate(0deg); opacity: 0; }
      10%  { opacity: .85; }
      90%  { opacity: .85; }
      100% { transform: translateY(-20vh) scale(1.1) rotate(360deg); opacity: 0; }
    }

    /* ══════════════════════════════════════════════════════════
       SECTION TITLE
       ══════════════════════════════════════════════════════════ */
    .section-title { position: relative; animation: ffRiseIn .9s cubic-bezier(.2,.9,.3,1.2) both; }
    .section-title h2 {
      background: linear-gradient(90deg, #0B1224 0%, #047857 40%, #0B1224 80%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: ffShine 7s linear infinite;
      position: relative;
      display: inline-block;
    }
    .section-title h2::after {
      content: "";
      position: absolute;
      left: 0; bottom: -6px;
      height: 3px; width: 60%;
      background: linear-gradient(90deg, #10b981, transparent);
      border-radius: 3px;
      animation: ffUnderline 2.4s ease-in-out infinite;
    }
    @keyframes ffShine { to { background-position: 200% center; } }
    @keyframes ffUnderline {
      0%   { transform: scaleX(0); transform-origin: left; }
      50%  { transform: scaleX(1); transform-origin: left; }
      51%  { transform: scaleX(1); transform-origin: right; }
      100% { transform: scaleX(0); transform-origin: right; }
    }
    @keyframes ffRiseIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ══════════════════════════════════════════════════════════
       FILTER BAR
       ══════════════════════════════════════════════════════════ */
    #ashram-search, #type-filter { backdrop-filter: blur(8px); transition: all .3s ease; }
    #ashram-search:focus, #type-filter:focus {
      outline: none;
      border-color: #10b981;
      box-shadow: 0 0 0 4px rgba(16,185,129,.18);
      transform: translateY(-1px);
    }
    #near-me-btn, #reset-btn { position: relative; overflow: hidden; transition: all .35s cubic-bezier(.2,.9,.3,1.3); }
    #near-me-btn::before, #reset-btn::before {
      content: ""; position: absolute; top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.4), transparent);
      transition: left .7s ease;
    }
    #near-me-btn:hover::before, #reset-btn:hover::before { left: 100%; }
    #near-me-btn:hover, #reset-btn:hover { transform: translateY(-2px); }

    /* ══════════════════════════════════════════════════════════
       ASHRAM GRID
       ══════════════════════════════════════════════════════════ */
    .ashram-grid-outer {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 1.5rem 4rem 1.5rem;
    }

    .ashram-tile {
      background: #fff;
      border-radius: 18px;
      border: 1px solid var(--slate-border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      transform-style: preserve-3d;
      opacity: 0;
      transform: translateY(30px) scale(.96);
      animation: ffTileIn .8s cubic-bezier(.2,.9,.3,1.2) forwards;
      transition: transform .45s cubic-bezier(.2,.9,.3,1.2),
                  box-shadow .45s ease,
                  border-color .4s ease;
      will-change: transform;
    }
    .ashram-tile:nth-child(1)  { animation-delay: .04s; }
    .ashram-tile:nth-child(2)  { animation-delay: .10s; }
    .ashram-tile:nth-child(3)  { animation-delay: .16s; }
    .ashram-tile:nth-child(4)  { animation-delay: .22s; }
    .ashram-tile:nth-child(5)  { animation-delay: .28s; }
    .ashram-tile:nth-child(6)  { animation-delay: .34s; }
    .ashram-tile:nth-child(7)  { animation-delay: .40s; }
    .ashram-tile:nth-child(8)  { animation-delay: .46s; }
    .ashram-tile:nth-child(n+9){ animation-delay: .52s; }
    @keyframes ffTileIn {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Glow gradient border on hover */
    .ashram-tile::before {
      content: "";
      position: absolute; inset: -2px;
      border-radius: 20px;
      padding: 2px;
      background: linear-gradient(135deg, #10b981, #8b5cf6, #fbbf24, #10b981);
      background-size: 300% 300%;
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
              mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
              mask-composite: exclude;
      opacity: 0;
      transition: opacity .4s ease;
      animation: ffBorderShift 6s linear infinite;
      pointer-events: none;
    }
    .ashram-tile:hover::before { opacity: 1; }
    @keyframes ffBorderShift {
      0%   { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }

    /* Light sweep on hover */
    .ashram-tile::after {
      content: "";
      position: absolute;
      top: -40%; left: -30%;
      width: 60%; height: 180%;
      background: linear-gradient(90deg, transparent, rgba(16,185,129,.10), transparent);
      transform: rotate(20deg);
      transition: transform 1s ease;
      pointer-events: none;
    }
    .ashram-tile:hover::after { transform: rotate(20deg) translateX(240%); }

    .ashram-tile:hover {
      transform: translateY(-10px) scale(1.015);
      box-shadow: 0 30px 70px -22px rgba(6,95,70,.35);
      border-color: #bbf7d0;
    }

    .ashram-tile-img-wrap { position: relative; height: 180px; overflow: hidden; }
    .ashram-tile-img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform .8s cubic-bezier(.2,.9,.3,1.2), filter .5s ease;
    }
    .ashram-tile:hover .ashram-tile-img {
      transform: scale(1.10) rotate(-.6deg);
      filter: saturate(1.15) brightness(1.03);
    }
    .ashram-tile-img-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.55) 100%);
    }
    .ashram-tile-type-tag {
      position: absolute; top: 0.65rem; left: 0.65rem;
      background: rgba(255,255,255,0.95);
      color: var(--dark-green);
      font-size: 0.65rem; font-weight: 800;
      padding: 0.25rem 0.6rem; border-radius: 6px;
      text-transform: uppercase; letter-spacing: 0.03em;
      max-width: 80%; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
      animation: ffTagPop .6s .3s cubic-bezier(.2,.9,.3,1.6) both;
    }
    @keyframes ffTagPop {
      0%   { opacity: 0; transform: translateY(-8px) scale(.85); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .ashram-tile-verified {
      position: absolute; top: 0.65rem; right: 0.65rem;
      background: #16a34a; color: #fff;
      font-size: 0.62rem; font-weight: 800;
      padding: 0.25rem 0.55rem; border-radius: 6px;
      animation: ffVerifiedPulse 2.4s ease-out infinite;
    }
    @keyframes ffVerifiedPulse {
      0%   { box-shadow: 0 0 0 0 rgba(22,163,74,.55); }
      70%  { box-shadow: 0 0 0 12px rgba(22,163,74,0); }
      100% { box-shadow: 0 0 0 0 rgba(22,163,74,0); }
    }

    .ashram-tile-body {
      padding: 1rem 1.1rem 1.15rem;
      display: flex; flex-direction: column; gap: 0.5rem; flex: 1;
    }
    .ashram-tile h3 { font-size: 1rem; margin: 0; color: var(--navy-dark); line-height: 1.3; }
    .ashram-tile-addr { font-size: 0.75rem; color: var(--text-muted); line-height: 1.5; margin: 0; }

    .ashram-tile-meta {
      display: flex; gap: 0.4rem; flex-wrap: wrap;
      font-size: 0.7rem; margin-top: auto;
    }
    .ashram-tile-meta span, .ashram-tile-meta a {
      background: #f1f5f9; color: var(--navy-dark);
      padding: 0.2rem 0.55rem; border-radius: 6px;
      text-decoration: none; font-weight: 600;
      transition: transform .3s ease, background .3s ease;
    }
    .ashram-tile:hover .ashram-tile-meta span,
    .ashram-tile:hover .ashram-tile-meta a { transform: translateY(-1px); }
    .ashram-tile-meta a { background: var(--light-green); color: var(--dark-green); }
    .ashram-tile-meta a:hover { background: var(--primary-green); color: #fff; }

    .ashram-tile-food {
      background: #fef3c7 !important;
      color: #92400e !important;
      font-weight: 800 !important;
      position: relative; overflow: hidden;
    }
    .ashram-tile-food::after {
      content: "";
      position: absolute; top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.7), transparent);
      animation: ffFoodShimmer 2.6s ease-in-out infinite;
    }
    @keyframes ffFoodShimmer { 0%{left:-100%;} 60%,100%{left:100%;} }

    .ashram-tile-dist {
      background: #dbeafe !important;
      color: #1e40af !important;
      font-weight: 800 !important;
      animation: ffDistPulse 2.8s ease-in-out infinite;
    }
    @keyframes ffDistPulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(37,99,235,.4); }
      50%     { box-shadow: 0 0 0 6px rgba(37,99,235,0); }
    }

    .ashram-tile-cta {
      display: inline-block; text-align: center;
      margin-top: 0.75rem; padding: 0.6rem;
      background: linear-gradient(135deg, var(--dark-green), var(--primary-green));
      color: #fff; font-weight: 700; font-size: 0.78rem;
      border-radius: 10px; text-decoration: none;
      position: relative; overflow: hidden;
      transition: transform .35s cubic-bezier(.2,.9,.3,1.3), box-shadow .35s ease;
      box-shadow: 0 10px 24px -12px rgba(6,95,70,.55);
    }
    .ashram-tile-cta::before {
      content: ""; position: absolute; top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.4), transparent);
      transition: left .7s ease;
    }
    .ashram-tile-cta:hover::before { left: 100%; }
    .ashram-tile-cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 36px -12px rgba(6,95,70,.75);
    }

    /* Skeleton loader */
    .ff-skeleton {
      background: linear-gradient(90deg, #eef2f7 0%, #f7fbfa 50%, #eef2f7 100%);
      background-size: 200% 100%;
      animation: ffSkeleton 1.4s linear infinite;
      border-radius: 18px;
      height: 340px;
    }
    @keyframes ffSkeleton {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    #ashram-empty-msg { animation: ffRiseIn .6s ease both; }

    @media (max-width: 640px) {
      .ashram-grid-outer { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
      }
    }
  </style>
</head>

  avatar:    loggedInUser.avatar    || '👤',
  roleLabel: loggedInUser.roleLabel || 'User',

} : {

  verified:  ''
};

const userRoleEl     = document.getElementById("userRole");
const userAvatarEl   = document.getElementById("userAvatar");
const userVerifiedEl = document.getElementById("userVerified");
const logoutBtn      = document.getElementById("logoutBtn");

function renderSidebar(user) {
  if (!sidebar) return;
  userNameEl.textContent = user.name;
  userRoleEl.textContent = user.roleLabel;
  userAvatarEl.textContent = user.avatar;
  if (userVerifiedEl) userVerifiedEl.textContent = user.verified ? '✔ ' + user.verified : '';

  menuContainer.innerHTML = "";
  const items = MENUS[user.role] || [];
  items.forEach(item => {
    const a = document.createElement("a");
    a.className = "menu-item";
    a.href = item.link;
    a.innerHTML = `<span class="icon">${item.icon}</span><span>${item.label}</span><span class="arrow">›</span>`;
    menuContainer.appendChild(a);
  });
}

function openSidebar() {
  sidebar.classList.add("active");
  overlay.classList.add("active");
  document.body.style.overflow = "hidden";
}
function closeSidebar() {
  sidebar.classList.remove("active");
  overlay.classList.remove("active");
  document.body.style.overflow = "";
}

const hamburgerBtn = document.getElementById("hamburgerBtn");
if (hamburgerBtn) hamburgerBtn.addEventListener("click", openSidebar);

const openBtn = document.getElementById("user-chip");
if (openBtn) openBtn.addEventListener("click", openSidebar);

if (closeBtn) closeBtn.addEventListener("click", closeSidebar);
if (overlay)  overlay.addEventListener("click", closeSidebar);

document.addEventListener("keydown", e => { if (e.key === "Escape") closeSidebar(); });

if (logoutBtn) {
  if (loggedInUser) {
    logoutBtn.addEventListener("click", () => {
      if (window.ffAuth) window.ffAuth.clear();
      if (window.ffToast) window.ffToast("You have been logged out.");
      setTimeout(() => { window.location.href = "index.html"; }, 600);
    });
  } else {
    logoutBtn.innerHTML = '<span class="icon">→</span> Login';
    logoutBtn.style.color = '#047857';
    logoutBtn.style.borderColor = '#bbf7d0';
    logoutBtn.style.background = '#ecfdf5';
    logoutBtn.addEventListener("click", () => {
      window.location.href = "index.html";
    });
  }
}

renderSidebar(currentUser);
</script>

    'https://images.unsplash.com/photo-1576381203531-d7171e2de67d?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D',
    'https://media.istockphoto.com/id/1405363601/photo/senior-indian-woman-with-eyeglasses-reading-book-at-home-concept-of-leisure-activity-hobbies.webp?a=1&b=1&s=612x612&w=0&k=20&c=2J-wwN6Slqp03s_HzbWzQ_-QpuF4TvVRRV_SxVX7eMo=',
    'https://images.unsplash.com/photo-1627752885954-e6956866dcbf?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D',
      'https://images.unsplash.com/photo-1526976668912-1a811878dd37?w=600&auto=format&fit=crop&q=75',
  ];

  function pickImage(index) {
    return PHOTOS[index % PHOTOS.length];
  }

  /* Pick a unique image per card using its index in the grid */
  function pickImage(index) {
    return PHOTOS[index % PHOTOS.length];
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  function distanceKm(lat1, lng1, lat2, lng2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLng = (lng2 - lng1) * Math.PI / 180;
    const a = Math.sin(dLat/2)**2 +
              Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) *
              Math.sin(dLng/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  /* ══════════════════════════════════════════════════════════
     ANIMATION: orbs + floating particles
     ══════════════════════════════════════════════════════════ */
  (function injectDecorations() {
    ['o1','o2','o3'].forEach(cls => {
      const o = document.createElement('div');
      o.className = 'ff-orb ' + cls;
      o.setAttribute('aria-hidden', 'true');
      document.body.appendChild(o);
    });

    const palette = [
      'radial-gradient(circle, rgba(16,185,129,.55), rgba(16,185,129,0) 70%)',
      'radial-gradient(circle, rgba(139,92,246,.45), rgba(139,92,246,0) 70%)',
      'radial-gradient(circle, rgba(245,158,11,.45), rgba(245,158,11,0) 70%)'
    ];
    for (let i = 0; i < 16; i++) {
      const p = document.createElement('div');
      p.setAttribute('aria-hidden', 'true');
      p.style.cssText =
        'position:fixed;border-radius:50%;pointer-events:none;z-index:0;' +
        'left:' + (Math.random()*100) + 'vw;' +
        'width:' + (4 + Math.random()*6) + 'px;' +
        'height:' + (4 + Math.random()*6) + 'px;' +
        'background:' + palette[i % 3] + ';' +
        'animation: ffFloatUp ' + (14 + Math.random()*16) + 's linear infinite;' +
        'animation-delay:-' + (Math.random()*24) + 's;';
      document.body.appendChild(p);
    }
  })();

  /* ══════════════════════════════════════════════════════════
     3D TILT
     ══════════════════════════════════════════════════════════ */
  function attachTileTilt() {
    document.querySelectorAll('.ashram-tile').forEach(card => {
      card.addEventListener('mousemove', (e) => {
        const r = card.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width;
        const y = (e.clientY - r.top)  / r.height;
        const rotY = (x - 0.5) * 10;
        const rotX = (0.5 - y) * 10;
        card.style.transform =
          'translateY(-10px) scale(1.015) ' +
          'perspective(900px) ' +
          'rotateX(' + rotX.toFixed(2) + 'deg) ' +
          'rotateY(' + rotY.toFixed(2) + 'deg)';
      });
      card.addEventListener('mouseleave', () => {
        card.style.transform = '';
      });
    });
  }

  /* ══════════════════════════════════════════════════════════
     RENDER
     ══════════════════════════════════════════════════════════ */
  function render() {
    const q    = (searchEl.value || '').toLowerCase().trim();
    const type = typeEl.value;

    let filtered = ALL_ASHRAMS.filter(a => {
      if (type && !(a.type || '').toLowerCase().includes(type.toLowerCase())) return false;
      if (q) {
        const hay = `${a.name} ${a.address} ${a.city} ${a.state}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    if (USER_LOC) {
      filtered.forEach(a => {
        if (a.location && a.location.coordinates) {
          const [lng, lat] = a.location.coordinates;
          a._dist = distanceKm(USER_LOC.lat, USER_LOC.lng, lat, lng);
        }
      });
      filtered.sort((a, b) => (a._dist ?? 9999) - (b._dist ?? 9999));
    }

    countEl.textContent = `Showing ${filtered.length} of ${ALL_ASHRAMS.length} ashrams & NGOs`;

    if (filtered.length === 0) {
      grid.innerHTML = '';
      emptyMsg.style.display = 'block';
      emptyMsg.textContent = 'No ashrams match your filters. Try resetting.';
      return;
    }

    emptyMsg.style.display = 'none';
      grid.innerHTML = filtered.map((a, i) => {
        const img = pickImage(i);
      const web = a.website
        ? (a.website.startsWith('http') ? a.website : `https://${a.website}`)
        : null;
      const distTag = a._dist != null
        ? `<span class="ashram-tile-dist">📍 ${a._dist.toFixed(1)} km</span>`
        : '';
      const foodTag = a.food_needed === 'Yes'
        ? `<span class="ashram-tile-food">🍱 Food Needed</span>`
        : '';

      return `
      <div class="ashram-tile">
        <div class="ashram-tile-img-wrap">
          <img class="ashram-tile-img" src="${img}" alt="${escapeHtml(a.name)}" loading="lazy">
          <div class="ashram-tile-img-overlay"></div>
          <span class="ashram-tile-type-tag">${escapeHtml(a.type || 'Ashram')}</span>
          ${a.verified === 'Yes' ? '<span class="ashram-tile-verified">✓ Verified</span>' : ''}
        </div>
        <div class="ashram-tile-body">
          <h3>${escapeHtml(a.name)}</h3>
          <p class="ashram-tile-addr">
            📍 ${escapeHtml(a.address || '')}${a.city ? ', ' + escapeHtml(a.city) : ''}${a.state ? ', ' + escapeHtml(a.state) : ''}
          </p>
          <div class="ashram-tile-meta">
            ${distTag}
            ${foodTag}
            ${a.phone ? `<span>📞 ${escapeHtml(a.phone)}</span>` : ''}
            ${web ? `<a href="${web}" target="_blank" rel="noopener">🌐 Website</a>` : ''}
          </div>
          <a href="donate-food.html" class="ashram-tile-cta" data-guest-donate>🍱 Donate Food Here →</a>
        </div>
      </div>`;
    }).join('');

    attachTileTilt();
  }

  /* ══════════════════════════════════════════════════════════
     SKELETON + EVENTS
     ══════════════════════════════════════════════════════════ */
  grid.innerHTML = Array.from({ length: 6 })
    .map(() => '<div class="ff-skeleton"></div>')
    .join('');

  searchEl.addEventListener('input', render);
  typeEl.addEventListener('change', render);

  nearBtn.addEventListener('click', () => {
    if (!navigator.geolocation) {
      if (window.ffToast) window.ffToast('⚠️ Browser does not support geolocation');
      return;
    }
    nearBtn.textContent = '⏳ Locating…';
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        USER_LOC = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        nearBtn.textContent = '📍 Near Me ✓';
        if (window.ffToast) window.ffToast('📍 Sorted by distance');
        render();
      },
      (err) => {
        console.warn(err);
        nearBtn.textContent = '📍 Near Me';
        if (window.ffToast) window.ffToast('❌ Location access denied');
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  });

  resetBtn.addEventListener('click', () => {
    searchEl.value = '';
    typeEl.value = '';
    USER_LOC = null;
    nearBtn.textContent = '📍 Near Me';
    render();
    if (window.ffToast) window.ffToast('↺ Filters reset');
  });

  /* Kick off initial render */
  setTimeout(() => {
    render();
    if (window.ffToast) window.ffToast(`✅ Loaded ${ALL_ASHRAMS.length} ashrams & NGOs`);
  }, 400);
});

/* ══════════════════════════════════════════════════════════
   Guest donate guard
   ══════════════════════════════════════════════════════════ */
document.addEventListener('click', (e) => {
  const link = e.target.closest('[data-guest-donate]');
  if (!link) return;
  const user = (window.ffAuth && window.ffAuth.getUser) ? window.ffAuth.getUser() : null;
  if (user) return;
  e.preventDefault();
  if (window.ffToast) window.ffToast('🔒 Please sign up as a Food Donor to donate');
  if (typeof window.ffOpenSignupModal === 'function') {
    window.ffOpenSignupModal();
  } else {
    setTimeout(() => { window.location.href = 'index.html?signup=1'; }, 500);
  }
});
</script>
