<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Deliveries | Admin | FeedFoodForward</title>
  <meta name="theme-color" content="#16a34a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    (function guardAdmin() {
      try {
        var _tabId = sessionStorage.getItem('ff_tab_id') || 'tab_fallback';
        var u = JSON.parse(localStorage.getItem('fff_current_user_' + _tabId) || 'null');
        if (!u || u.role !== 'admin') { location.replace('admin-login.html'); return; }
      } catch (e) { location.replace('admin-login.html'); }
    })();
  </script>
</head>
<body>

<header class="site-header">
  <div class="header-container">
    <button type="button" class="hamburger-btn" id="hamburgerBtn" aria-label="Open menu">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <a href="admin-portal.html" class="brand-logo">
      <div class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="ffTileDlv" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#067A54"/><stop offset="55%" stop-color="#0B9F6E"/><stop offset="100%" stop-color="#10B981"/></linearGradient>
            <linearGradient id="ffHeartDlv" x1="0" y1="0" x2="0.5" y2="1"><stop offset="0%" stop-color="#FF5A7A"/><stop offset="100%" stop-color="#F03E64"/></linearGradient>
            <linearGradient id="ffLeafDlv" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#A3E635"/><stop offset="100%" stop-color="#65A30D"/></linearGradient>
          </defs>
          <rect x="2" y="2" width="44" height="44" rx="11" fill="url(#ffTileDlv)"/>
          <g transform="translate(28 6) rotate(20)"><path d="M0 14 C0 6 5 1 12 0 C12 8 7 14 0 14 Z" fill="url(#ffLeafDlv)"/></g>
          <g transform="translate(8 20)"><path d="M10 20 C2 14 -1 10 -1 6 C-1 2.6 1.7 0.4 5 0.4 C7.4 0.4 9.2 1.8 10 3.4 C10.8 1.8 12.6 0.4 15 0.4 C18.3 0.4 21 2.6 21 6 C21 10 18 14 10 20 Z" fill="url(#ffHeartDlv)"/></g>
        </svg>
      </div>
      <div class="brand-text"><span class="brand-title">FeedFood<span>Forward</span></span><span class="brand-subtitle">ADMIN PANEL</span></div>
    </a>
    
    <nav class="site-nav" id="site-nav"></nav>
    <div class="header-utilities">
      <div id="header-user" class="header-user-group">
        <button type="button" class="user-chip" id="user-chip"><span class="user-avatar" id="user-avatar">⚡</span><span class="user-name" id="user-name">Admin</span><span class="user-caret">▾</span></button>
      </div>
    </div>
  </div>
</header>

<!-- The sidebar will be automatically injected here by sidebar.js -->
<main style="padding: 3rem 1.5rem 4rem; min-height: 80vh; max-width: 1200px; margin: 0 auto;">
  <section class="admin-section">
    <div class="section-title">
      <h2>All Deliveries</h2>
      <p>Monitor delivery progress across the platform.</p>
    </div>

    <div class="admin-box" style="max-width:1100px; margin: 0 auto;">
      <div style="display:flex;gap:0.75rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem;">
        <input type="text" id="dlv-search" class="search-input" placeholder="Search by donation ID, driver or ashram..." style="flex:1;min-width:220px;">
        <select id="dlv-stage-filter" class="role-dropdown" style="max-width:200px;">
          <option value="">All Stages</option>
          <option value="pending">Pending</option>
          <option value="accepted">Accepted</option>
          <option value="transit">In Transit</option>
          <option value="delivered">Delivered</option>
        </select>
      </div>

      <div id="dlv-list" style="display:flex;flex-direction:column;gap:0.75rem;">
        <p style="text-align:center;color:#94a3b8;padding:1rem;">⏳ Loading deliveries…</p>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="footer-container">
    <div class="footer-brand"><h3>FeedFoodForward</h3><p>"Rescue Food. Reduce Waste. Feed Communities."</p></div>
    <div class="footer-copyright">© 2026 FeedFoodForward Platform.</div>
  </div>
</footer>

<div id="ff-toast" style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120%);background:#0f172a;color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:all .3s ease;z-index:9999;"></div>

<script src="app.js"></script>
<script src="header-nav.js"></script>
<script src="sidebar.js"></script>
<script src="animations.js"></script>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const user = (window.ffAuth && window.ffAuth.getUser) ? window.ffAuth.getUser() : null;
  const esc = s => String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  
  if (user) {
    const n = document.getElementById('user-name');   if (n) n.textContent = user.name || 'Admin';
    const a = document.getElementById('user-avatar'); if (a) a.textContent = user.avatar || '⚡';
  }

  let ALL = [];
  function stageOf(d) {
    const s = (d.status || '').toLowerCase();
    if (s.includes('deliver')) return 'delivered';
    if (s.includes('transit') || s.includes('picked')) return 'transit';
    if (s.includes('accepted') || s.includes('approved')) return 'accepted';
    return 'pending';
  }

  async function load() {
    const wrap = document.getElementById('dlv-list');
    try {
      const r = await fetch('/api/donations');
      const d = await r.json();
      ALL = d.donations || [];
      render();
    } catch (e) {
      wrap.innerHTML = '<p style="color:#dc2626;text-align:center;">⚠️ Load failed.</p>';
    }
  }
  
  function render() {
    const wrap = document.getElementById('dlv-list');
    const q = (document.getElementById('dlv-search').value || '').toLowerCase();
    const stage = document.getElementById('dlv-stage-filter').value;

    const filtered = ALL.filter(d => {
      if (stage && stageOf(d) !== stage) return false;
      if (q) {
        const hay = [d.donationId, d.driverName, d.ashramName, d.donorName].filter(Boolean).join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    if (!filtered.length) { wrap.innerHTML = '<p style="text-align:center;color:#94a3b8;padding:1rem;">No deliveries match.</p>'; return; }

    wrap.innerHTML = filtered.map(d => {
      const status = d.status || 'Pending';
      const s = status.toLowerCase();
      const cls = s.includes('deliver') ? 'verified' : s.includes('reject') ? 'demo' : 'verified';
      return `
        <div style="border:1px solid #e2e8f0;border-radius:12px;padding:1rem 1.15rem;background:#fff;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:0.75rem;flex-wrap:wrap;">
            <div>
              <div style="font-family:monospace;font-size:0.75rem;color:#94a3b8;">${esc(d.donationId)}</div>
              <div style="font-weight:800;font-size:0.95rem;color:#0f172a;margin-top:2px;">${esc(d.foodName || 'Prepared Meal')}</div>
              <div style="font-size:0.78rem;color:#64748b;margin-top:4px;">
                From <strong>${esc(d.donorName || 'Donor')}</strong> · To <strong>${esc(d.ashramName || 'Ashram')}</strong>
              </div>
            </div>
            <span class="badge ${cls}">${esc(status)}</span>
          </div>
          <div style="display:flex;gap:1rem;font-size:0.78rem;color:#475569;margin-top:0.75rem;flex-wrap:wrap;">
            <span>🚚 Driver: <strong>${esc(d.driverName || 'Unassigned')}</strong></span>
            <span>⚖️ ${Number(d.weightKg)||0} kg</span>
            <span>🍽️ ${Number(d.servings)||0} servings</span>
          </div>
        </div>`;
    }).join('');
  }
  document.getElementById('dlv-search').addEventListener('input', render);
  document.getElementById('dlv-stage-filter').addEventListener('change', render);
  load();
  setInterval(load, 20000);
});
</script>

<style>
  /* HEAVY ANIMATIONS FOR ADMIN */
  body.admin-anim-active { opacity: 0; transition: opacity 0.8s ease; background: radial-gradient(800px 600px at 10% 10%, rgba(16,185,129,0.08), transparent 60%), radial-gradient(800px 600px at 90% 90%, rgba(59,130,246,0.06), transparent 60%), #f6f9fc; background-size: 200% 200%; animation: adminBgShift 15s ease-in-out infinite alternate; }
  body.admin-anim-active.admin-ready { opacity: 1; }
  @keyframes adminBgShift { 0% { background-position: 0% 0%; } 100% { background-position: 100% 100%; } }

  .admin-particle { position: fixed; border-radius: 50%; pointer-events: none; z-index: 0; animation: adminFloatUp linear infinite; }
  @keyframes adminFloatUp { 0% { transform: translateY(105vh) scale(0.4) rotate(0deg); opacity: 0; } 10% { opacity: 0.7; } 90% { opacity: 0.7; } 100% { transform: translateY(-20vh) scale(1.2) rotate(360deg); opacity: 0; } }

  .admin-cursor-glow { position: fixed; pointer-events: none; z-index: 9999; width: 400px; height: 400px; border-radius: 50%; background: radial-gradient(circle, rgba(16,185,129,0.12), transparent 70%); transform: translate(-50%, -50%); filter: blur(40px); opacity: 0; transition: opacity 0.3s ease; }

  .admin-box, .impact-box, .section-title { opacity: 0; transform: translateY(30px); transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.4s ease, border-color 0.4s ease; position: relative; z-index: 1; overflow: hidden; }
  .admin-box.admin-in, .impact-box.admin-in, .section-title.admin-in { opacity: 1; transform: none; }
  
  .admin-box::before { content: ""; position: absolute; top: 0; left: -100%; width: 50%; height: 100%; background: linear-gradient(90deg, transparent, rgba(16,185,129,0.08), transparent); transform: skewX(-20deg); transition: left 0.7s ease; pointer-events: none; }
  .admin-box:hover::before { left: 200%; }
  .admin-box:hover { transform: translateY(-5px); border-color: #a7f3d0; box-shadow: 0 15px 35px -10px rgba(16,185,129,0.25); }

  #dlv-list > div { opacity: 0; transform: translateX(-20px); transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); }
  #dlv-list > div.dlv-in { opacity: 1; transform: none; }
  #dlv-list > div:hover { transform: translateY(-3px) scale(1.01); box-shadow: 0 10px 25px -8px rgba(16,185,129,0.2); border-color: #a7f3d0 !important; }

  .badge { position: relative; overflow: hidden; }
  .badge::after { content: ""; position: absolute; top: 0; left: -100%; width: 50%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent); transform: skewX(-20deg); animation: badgeShine 3s infinite; }
  @keyframes badgeShine { 0% { left: -100%; } 20%, 100% { left: 200%; } }
  .badge.verified { animation: badgePulseGreen 2.5s infinite; }
  .badge.demo { animation: badgePulseRed 2.5s infinite; }
  @keyframes badgePulseGreen { 0%, 100% { box-shadow: 0 0 0 0 rgba(16,185,129,0.4); } 50% { box-shadow: 0 0 0 6px rgba(16,185,129,0); } }
  @keyframes badgePulseRed { 0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.4); } 50% { box-shadow: 0 0 0 6px rgba(239,68,68,0); } }
</style>

<script>
document.addEventListener('DOMContentLoaded', () => {
  'use strict';
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (!reducedMotion) {
    document.body.classList.add('admin-anim-active');
    requestAnimationFrame(() => document.body.classList.add('admin-ready'));

    const palette = [
      'radial-gradient(circle, rgba(16,185,129,0.4), transparent 70%)',
      'radial-gradient(circle, rgba(59,130,246,0.3), transparent 70%)',
      'radial-gradient(circle, rgba(245,158,11,0.3), transparent 70%)'
    ];
    for (let i = 0; i < 25; i++) {
      const p = document.createElement('div');
      p.className = 'admin-particle';
      p.style.left = (Math.random() * 100) + 'vw';
      p.style.width = p.style.height = (4 + Math.random() * 8) + 'px';
      p.style.background = palette[i % 3];
      p.style.animationDuration = (12 + Math.random() * 16) + 's';
      p.style.animationDelay = '-' + (Math.random() * 20) + 's';
      document.body.appendChild(p);
    }
  }

  if (!reducedMotion && window.matchMedia('(hover: hover) and (min-width: 1024px)').matches) {
    const glow = document.createElement('div');
    glow.className = 'admin-cursor-glow';
    document.body.appendChild(glow);
    let mouseX = 0, mouseY = 0, glowX = 0, glowY = 0;
    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX; mouseY = e.clientY;
      glow.style.opacity = '1';
    });
    document.addEventListener('mouseleave', () => { glow.style.opacity = '0'; });
    (function animateGlow() {
      glowX += (mouseX - glowX) * 0.15;
      glowY += (mouseY - glowY) * 0.15;
      glow.style.left = glowX + 'px';
      glow.style.top = glowY + 'px';
      requestAnimationFrame(animateGlow);
    })();
  }

  const revealEls = document.querySelectorAll('.admin-box, .impact-box, .section-title');
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver((entries) => {
      entries.forEach((entry, i) => {
        if (entry.isIntersecting) {
          setTimeout(() => { entry.target.classList.add('admin-in'); }, i * 60);
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -20px 0px' });
    revealEls.forEach(el => io.observe(el));
  } else {
    revealEls.forEach(el => el.classList.add('admin-in'));
  }

  function animateRows() {
    const dlvCards = document.querySelectorAll('#dlv-list > div');
    dlvCards.forEach((card, i) => {
      if (!card.classList.contains('dlv-in')) {
        card.style.transitionDelay = (i * 50) + 'ms';
        card.classList.add('dlv-in');
      }
    });
  }

  setTimeout(animateRows, 300);

  const observer = new MutationObserver((mutations) => {
    mutations.forEach((m) => {
      if (m.addedNodes.length) animateRows();
    });
  });

  const targets = document.querySelectorAll('#dlv-list');
  targets.forEach(t => observer.observe(t, { childList: true }));
});
</script>
</body>
</html>
