<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Donations | Admin | FeedFoodForward</title>
  <meta name="theme-color" content="#16a34a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    (function guardAdmin() {
      try {
        var _tabId = sessionStorage.getItem('ff_tab_id') || 'tab_fallback';
        var u = JSON.parse(localStorage.getItem('fff_current_user_' + _tabId) || 'null');
        if (!u || u.role !== 'admin') { location.replace('admin-login.html'); return; }
      } catch (e) { location.replace('admin-login.html'); }
    })();
  </script>
</head>
<body>

<header class="site-header">
  <div class="header-container">
    <button type="button" class="hamburger-btn" id="hamburgerBtn" aria-label="Open menu">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <a href="admin-portal.html" class="brand-logo">
      <div class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="ffTileDlv" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#067A54"/><stop offset="55%" stop-color="#0B9F6E"/><stop offset="100%" stop-color="#10B981"/></linearGradient>
            <linearGradient id="ffHeartDlv" x1="0" y1="0" x2="0.5" y2="1"><stop offset="0%" stop-color="#FF5A7A"/><stop offset="100%" stop-color="#F03E64"/></linearGradient>
            <linearGradient id="ffLeafDlv" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#A3E635"/><stop offset="100%" stop-color="#65A30D"/></linearGradient>
          </defs>
          <rect x="2" y="2" width="44" height="44" rx="11" fill="url(#ffTileDlv)"/>
          <g transform="translate(28 6) rotate(20)"><path d="M0 14 C0 6 5 1 12 0 C12 8 7 14 0 14 Z" fill="url(#ffLeafDlv)"/></g>
          <g transform="translate(8 20)"><path d="M10 20 C2 14 -1 10 -1 6 C-1 2.6 1.7 0.4 5 0.4 C7.4 0.4 9.2 1.8 10 3.4 C10.8 1.8 12.6 0.4 15 0.4 C18.3 0.4 21 2.6 21 6 C21 10 18 14 10 20 Z" fill="url(#ffHeartDlv)"/></g>
        </svg>
      </div>
      <div class="brand-text"><span class="brand-title">FeedFood<span>Forward</span></span><span class="brand-subtitle">ADMIN PANEL</span></div>
    </a>
    
    <nav class="site-nav" id="site-nav"></nav>
    <div class="header-utilities">
      <div id="header-user" class="header-user-group">
        <button type="button" class="user-chip" id="user-chip"><span class="user-avatar" id="user-avatar">⚡</span><span class="user-name" id="user-name">Admin</span><span class="user-caret">▾</span></button>
      </div>
    </div>
  </div>
</header>

<!-- The sidebar is injected automatically by sidebar.js -->
<main style="padding: 3rem 1.5rem 4rem; min-height: 80vh; max-width: 1200px; margin: 0 auto;">
  <section class="admin-section">
    <div class="section-title">
      <h2>Manage Donations</h2>
      <p>View and track all food donations across the platform.</p>
    </div>

    <div class="admin-box" style="max-width:1100px; margin: 0 auto; padding: 1.5rem;">
      
      <!-- Filters -->
      <div style="display:flex;gap:0.75rem;flex-wrap:wrap;align-items:center;margin-bottom:1.5rem;">
        <input type="text" id="don-search" class="search-input" placeholder="🔍 Search by ID, food, donor or ashram..." style="flex:1;min-width:220px; padding: 0.75rem 1rem; border-radius: 12px; border: 1.5px solid #e2e8f0;">
        <select id="don-status-filter" class="role-dropdown" style="max-width:200px; padding: 0.75rem 1rem; border-radius: 12px; border: 1.5px solid #e2e8f0; font-weight: 600; color: #475569;">
          <option value="">All Statuses</option>
          <option value="Pending">Pending</option>
          <option value="Claimed">Claimed</option>
          <option value="Approved">Approved</option>
          <option value="Accepted">Accepted</option>
          <option value="In Transit">In Transit</option>
          <option value="Delivered">Delivered</option>
          <option value="Rejected">Rejected</option>
        </select>
      </div>

      <!-- Table -->
      <div style="overflow-x:auto; border: 1px solid #e2e8f0; border-radius: 12px;">
        <table class="leaderboard-table" style="min-width:820px; margin: 0; width: 100%;">
          <thead>
            <tr style="background: #f8fafc;">
              <th style="padding: 1rem; text-align: left; font-size: 0.75rem; color: #64748b; text-transform: uppercase;">Donation ID</th>
              <th style="padding: 1rem; text-align: left; font-size: 0.75rem; color: #64748b; text-transform: uppercase;">Food</th>
              <th style="padding: 1rem; text-align: left; font-size: 0.75rem; color: #64748b; text-transform: uppercase;">Donor</th>
              <th style="padding: 1rem; text-align: left; font-size: 0.75rem; color: #64748b; text-transform: uppercase;">Ashram</th>
              <th style="padding: 1rem; text-align: left; font-size: 0.75rem; color: #64748b; text-transform: uppercase;">Driver</th>
              <th style="padding: 1rem; text-align: left; font-size: 0.75rem; color: #64748b; text-transform: uppercase;">Weight</th>
              <th style="padding: 1rem; text-align: left; font-size: 0.75rem; color: #64748b; text-transform: uppercase;">Status</th>
            </tr>
          </thead>
          <tbody id="don-tbody">
            <tr><td colspan="7" style="text-align:center;padding:2rem;color:#94a3b8;">⏳ Loading donations…</td></tr>
          </tbody>
        </table>
      </div>

    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="footer-container">
    <div class="footer-brand"><h3>FeedFoodForward</h3><p>"Rescue Food. Reduce Waste. Feed Communities."</p></div>
    <div class="footer-copyright">© 2026 FeedFoodForward Platform.</div>
  </div>
</footer>

<div id="ff-toast" style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120%);background:#0f172a;color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:all .3s ease;z-index:9999;"></div>

<script src="app.js"></script>
<script src="header-nav.js"></script>
<script src="sidebar.js"></script>
<script src="animations.js"></script>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const user = (window.ffAuth && window.ffAuth.getUser) ? window.ffAuth.getUser() : null;
  const esc = s => String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  
  if (user) {
    const n = document.getElementById('user-name');   if (n) n.textContent = user.name || 'Admin';
    const a = document.getElementById('user-avatar'); if (a) a.textContent = user.avatar || '⚡';
  }

  let ALL = [];
  async function load() {
    const tbody = document.getElementById('don-tbody');
    try {
      const r = await fetch('/api/donations');
      const d = await r.json();
      ALL = d.donations || [];
      render();
    } catch (e) {
      tbody.innerHTML = '<tr><td colspan="7" style="color:#dc2626;padding:1.5rem;text-align:center;">⚠️ Load failed.</td></tr>';
    }
  }

  function render() {
    const tbody = document.getElementById('don-tbody');
    const q = (document.getElementById('don-search').value || '').toLowerCase();
    const status = document.getElementById('don-status-filter').value;

    const filtered = ALL.filter(d => {
      if (status && (d.status || '') !== status) return false;
      if (q) {
        const hay = [d.donationId, d.foodName, d.donorName, d.ashramName].filter(Boolean).join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    if (!filtered.length) { 
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:2rem;color:#94a3b8;">No donations match your search.</td></tr>'; 
      return; 
    }

    tbody.innerHTML = filtered.map((d, index) => {
      const s = (d.status || 'Pending').toLowerCase();
      const badgeClass = s.includes('deliver') ? 'verified' : s.includes('reject') ? 'demo' : 'verified';
      return `
      <tr class="donation-row" style="border-bottom: 1px solid #f1f5f9; transition: background 0.2s;">
        <td style="padding: 1rem; font-family: monospace; font-size: 0.8rem; color: #64748b;">${esc(d.donationId)}</td>
        <td style="padding: 1rem; font-weight: 700; color: #0f172a;">${esc(d.foodName || '—')}</td>
        <td style="padding: 1rem; font-size: 0.85rem; color: #334155;">${esc(d.donorName || '—')}</td>
        <td style="padding: 1rem; font-size: 0.85rem; color: #334155;">${esc(d.ashramName || '—')}</td>
        <td style="padding: 1rem; font-size: 0.85rem; color: #334155;">${esc(d.driverName || 'Unassigned')}</td>
        <td style="padding: 1rem; font-size: 0.85rem; font-weight: 600;">${Number(d.weightKg) || 0} kg</td>
        <td style="padding: 1rem;"><span class="badge ${badgeClass}">${esc(d.status || 'Pending')}</span></td>
      </tr>`;
    }).join('');
  }

  document.getElementById('don-search').addEventListener('input', render);
  document.getElementById('don-status-filter').addEventListener('change', render);
  load();
  setInterval(load, 30000);
});
</script>

<style>
  /* 1. PAGE ENTRANCE & DYNAMIC BACKGROUND */
  body.admin-anim-active {
    opacity: 0;
    transition: opacity 0.8s ease;
    background: 
      radial-gradient(800px 600px at 10% 10%, rgba(16,185,129,0.08), transparent 60%),
      radial-gradient(800px 600px at 90% 90%, rgba(59,130,246,0.06), transparent 60%),
      radial-gradient(800px 600px at 50% 50%, rgba(245,158,11,0.04), transparent 60%),
      #f6f9fc;
    background-size: 200% 200%;
    animation: adminBgShift 15s ease-in-out infinite alternate;
  }
  body.admin-anim-active.admin-ready {
    opacity: 1;
  }
  @keyframes adminBgShift {
    0% { background-position: 0% 0%; }
    100% { background-position: 100% 100%; }
  }

  /* FLOATING PARTICLES */
  .admin-particle {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
    animation: adminFloatUp linear infinite;
  }
  @keyframes adminFloatUp {
    0% { transform: translateY(105vh) scale(0.4) rotate(0deg); opacity: 0; }
    10% { opacity: 0.7; }
    90% { opacity: 0.7; }
    100% { transform: translateY(-20vh) scale(1.2) rotate(360deg); opacity: 0; }
  }

  /* CURSOR GLOW */
  .admin-cursor-glow {
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(16,185,129,0.12), transparent 70%);
    transform: translate(-50%, -50%);
    filter: blur(40px);
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  /* CARD & BOX ANIMATIONS */
  .admin-box, .impact-box, .section-title {
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.4s ease, border-color 0.4s ease;
    position: relative;
    z-index: 1;
    overflow: hidden;
  }
  .admin-box.admin-in, .impact-box.admin-in, .section-title.admin-in {
    opacity: 1;
    transform: none;
  }
  
  .admin-box::before {
    content: "";
    position: absolute;
    top: 0; left: -100%; width: 50%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(16,185,129,0.08), transparent);
    transform: skewX(-20deg);
    transition: left 0.7s ease;
    pointer-events: none;
  }
  .admin-box:hover::before { left: 200%; }
  .admin-box:hover {
    transform: translateY(-5px);
    border-color: #a7f3d0;
    box-shadow: 0 15px 35px -10px rgba(16,185,129,0.25);
  }

  /* TABLE ANIMATIONS */
  .leaderboard-table tbody tr {
    opacity: 0;
    transform: translateX(-15px);
    transition: opacity 0.4s ease, transform 0.4s ease, background 0.3s ease;
  }
  .leaderboard-table tbody tr.row-in {
    opacity: 1;
    transform: none;
  }
  
  .leaderboard-table tbody tr {
    position: relative;
    cursor: pointer;
  }
  .leaderboard-table tbody tr::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0; width: 3px;
    background: #10b981;
    transform: scaleY(0);
    transform-origin: top;
    transition: transform 0.3s ease;
  }
  .leaderboard-table tbody tr:hover::before {
    transform: scaleY(1);
  }
  .leaderboard-table tbody tr:hover {
    background: #f0fdf4 !important;
    transform: translateX(4px);
  }

  /* PULSING STATUS BADGES */
  .badge {
    position: relative;
    overflow: hidden;
    display: inline-block;
    padding: 0.35rem 0.75rem;
    border-radius: 999px;
    font-size: 0.7rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .badge::after {
    content: "";
    position: absolute;
    top: 0; left: -100%; width: 50%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
    transform: skewX(-20deg);
    animation: badgeShine 3s infinite;
  }
  @keyframes badgeShine {
    0% { left: -100%; }
    20%, 100% { left: 200%; }
  }
  .badge.verified { background: #d1fae5; color: #065f46; animation: badgePulseGreen 2.5s infinite; }
  .badge.demo { background: #fee2e2; color: #991b1b; animation: badgePulseRed 2.5s infinite; }
  @keyframes badgePulseGreen {
    0%, 100% { box-shadow: 0 0 0 0 rgba(16,185,129,0.4); }
    50% { box-shadow: 0 0 0 6px rgba(16,185,129,0); }
  }
  @keyframes badgePulseRed {
    0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.4); }
    50% { box-shadow: 0 0 0 6px rgba(239,68,68,0); }
  }
</style>

<script>
document.addEventListener('DOMContentLoaded', () => {
  'use strict';
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // 1. Page Entrance
  if (!reducedMotion) {
    document.body.classList.add('admin-anim-active');
    requestAnimationFrame(() => document.body.classList.add('admin-ready'));
  }

  // 2. Spawn Floating Particles
  if (!reducedMotion) {
    const palette = [
      'radial-gradient(circle, rgba(16,185,129,0.4), transparent 70%)',
      'radial-gradient(circle, rgba(59,130,246,0.3), transparent 70%)',
      'radial-gradient(circle, rgba(245,158,11,0.3), transparent 70%)'
    ];
    for (let i = 0; i < 25; i++) {
      const p = document.createElement('div');
      p.className = 'admin-particle';
      p.style.left = (Math.random() * 100) + 'vw';
      p.style.width = p.style.height = (4 + Math.random() * 8) + 'px';
      p.style.background = palette[i % 3];
      p.style.animationDuration = (12 + Math.random() * 16) + 's';
      p.style.animationDelay = '-' + (Math.random() * 20) + 's';
      document.body.appendChild(p);
    }
  }

  // 3. Cursor Glow
  if (!reducedMotion && window.matchMedia('(hover: hover) and (min-width: 1024px)').matches) {
    const glow = document.createElement('div');
    glow.className = 'admin-cursor-glow';
    document.body.appendChild(glow);
    let mouseX = 0, mouseY = 0, glowX = 0, glowY = 0;
    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX; mouseY = e.clientY;
      glow.style.opacity = '1';
    });
    document.addEventListener('mouseleave', () => { glow.style.opacity = '0'; });
    (function animateGlow() {
      glowX += (mouseX - glowX) * 0.15;
      glowY += (mouseY - glowY) * 0.15;
      glow.style.left = glowX + 'px';
      glow.style.top = glowY + 'px';
      requestAnimationFrame(animateGlow);
    })();
  }

  // 4. Scroll Reveal for Admin Boxes & Stats
  const revealEls = document.querySelectorAll('.admin-box, .impact-box, .section-title');
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver((entries) => {
      entries.forEach((entry, i) => {
        if (entry.isIntersecting) {
          setTimeout(() => { entry.target.classList.add('admin-in'); }, i * 60);
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -20px 0px' });
    revealEls.forEach(el => io.observe(el));
  } else {
    revealEls.forEach(el => el.classList.add('admin-in'));
  }

  // 5. Animate Table Rows & Delivery Cards
  function animateRows() {
    const rows = document.querySelectorAll('.leaderboard-table tbody tr');
    rows.forEach((row, i) => {
      if (!row.classList.contains('row-in')) {
        row.style.transitionDelay = (i * 40) + 'ms';
        row.classList.add('row-in');
      }
    });
  }

  setTimeout(animateRows, 300);

  const observer = new MutationObserver((mutations) => {
    mutations.forEach((m) => {
      if (m.addedNodes.length) animateRows();
    });
  });

  const targets = document.querySelectorAll('.leaderboard-table tbody');
  targets.forEach(t => observer.observe(t, { childList: true }));
});
</script>
</body>
</html>
