<style>
  .rest-tile {
    background: #fff; border-radius: 18px;
    border: 1px solid var(--slate-border);
    overflow: hidden; transition: all .25s ease;
    display: flex; flex-direction: column;
  }
  .rest-tile:hover {
    transform: translateY(-4px);
    box-shadow: 0 16px 32px -12px rgba(16,185,129,.22);
    border-color: var(--primary-green);
  }
  .rest-tile-img-wrap {
    position: relative; height: 160px; overflow: hidden;
    background: linear-gradient(135deg, #ecfdf5, #d1fae5);
    display: flex; align-items: center; justify-content: center;
    font-size: 3.5rem;
  }
  .rest-tile-type-tag {
    position: absolute; top: 0.65rem; left: 0.65rem;
    background: rgba(255,255,255,.95); color: var(--dark-green);
    font-size: 0.62rem; font-weight: 800;
    padding: 0.25rem 0.6rem; border-radius: 6px;
    text-transform: uppercase; letter-spacing: .03em;
  }
  .rest-tile-rating {
    position: absolute; top: 0.65rem; right: 0.65rem;
    background: #fef3c7; color: #92400e;
    font-size: 0.65rem; font-weight: 800;
    padding: 0.25rem 0.55rem; border-radius: 6px;
  }
  .rest-tile-body {
    padding: 1rem 1.1rem 1.15rem;
    display: flex; flex-direction: column; gap: 0.5rem; flex: 1;
  }
  .rest-tile h3 { font-size: 1rem; margin: 0; color: var(--navy-dark); line-height: 1.3; }
  .rest-tile-addr { font-size: 0.75rem; color: var(--text-muted); line-height: 1.5; margin: 0; }
  .rest-tile-meta { display: flex; gap: 0.4rem; flex-wrap: wrap; font-size: 0.7rem; margin-top: auto; }
  .rest-tile-meta span, .rest-tile-meta a {
    background: #f1f5f9; color: var(--navy-dark);
    padding: 0.2rem 0.55rem; border-radius: 6px;
    text-decoration: none; font-weight: 600;
  }
  .rest-tile-meta a { background: var(--light-green); color: var(--dark-green); }
  .rest-tile-meta a:hover { background: var(--primary-green); color: #fff; }
  .rest-tile-cuisine { background: #dbeafe !important; color: #1e40af !important; font-weight: 800 !important; }
  .rest-tile-cta {
    display: inline-block; text-align: center;
    margin-top: 0.75rem; padding: 0.6rem;
    background: linear-gradient(135deg, var(--dark-green), var(--primary-green));
    color: #fff; font-weight: 700; font-size: 0.78rem;
    border-radius: 10px; text-decoration: none;
  }
  .rest-tile-cta:hover { opacity: .9; }
  .ashram-grid-outer {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1.5rem;
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 1.5rem 4rem 1.5rem;
  }
</style>

  function esc(s) {
    return String(s || '').replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }

  var grid = document.getElementById('rest-grid');
  var empty = document.getElementById('rest-empty-msg');
  var count = document.getElementById('rest-count');
  var search = document.getElementById('rest-search');
  var cuisine = document.getElementById('rest-cuisine-filter');
  var reset = document.getElementById('rest-reset-btn');

  function render() {
    var q = (search.value || '').toLowerCase().trim();
    var c = cuisine.value;

    var filtered = RESTAURANTS.filter(function (r) {
      if (c && r.cuisine !== c) return false;
      if (q) {
        var hay = (r.name + ' ' + r.area + ' ' + r.address + ' ' + r.cuisine).toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    count.textContent = 'Showing ' + filtered.length + ' of ' + RESTAURANTS.length + ' restaurants';

    if (filtered.length === 0) {
      grid.innerHTML = '';
      empty.style.display = 'block';
      empty.textContent = 'No restaurants match your search. Try a different keyword.';
      return;
    }
    empty.style.display = 'none';

    grid.innerHTML = filtered.map(function (r) {
      return (
        '<div class="rest-tile">' +
          '<div class="rest-tile-img-wrap">' +
            '<img src="' + esc(r.img) + '" alt="' + esc(r.name) + '" ' +
                 'style="width:100%;height:100%;object-fit:cover;display:block;" ' +
                 'loading="lazy" ' +
                 'onerror="this.parentElement.style.fontSize=\'3.5rem\';this.parentElement.innerHTML=\'🍽️<span class=&quot;rest-tile-type-tag&quot;>Restaurant</span><span class=&quot;rest-tile-rating&quot;>⭐ ' + r.rating.toFixed(1) + '</span>\';">' +
            '<span class="rest-tile-type-tag">Restaurant</span>' +
            '<span class="rest-tile-rating">⭐ ' + r.rating.toFixed(1) + '</span>' +
          '</div>' +
          '<div class="rest-tile-body">' +
            '<h3>' + esc(r.name) + '</h3>' +
            '<p class="rest-tile-addr">📍 ' + esc(r.area) + ' — ' + esc(r.address) + '</p>' +
            '<div class="rest-tile-meta">' +
              '<span class="rest-tile-cuisine">' + esc(r.cuisine) + '</span>' +
            '</div>' +
            '<a href="donate-food.html" class="rest-tile-cta" data-guest-donate>🍱 Donate from here →</a>' +
          '</div>' +
        '</div>'
      );
    }).join('');
  }

  if (search)  search.addEventListener('input', render);
  if (cuisine) cuisine.addEventListener('change', render);

  if (reset) {
    reset.addEventListener('click', function () {
      search.value = '';
      cuisine.value = '';
      render();
      if (window.ffToast) window.ffToast('↺ Filters reset');
    });
  }

  render();

  /* Guest donate guard — ask guest to log in / sign up as a Food Donor */
  document.addEventListener('click', function (e) {
    var link = e.target.closest('[data-guest-donate]');
    if (!link) return;
    var user = (window.ffAuth && window.ffAuth.getUser) ? window.ffAuth.getUser() : null;
    if (user) return;
    e.preventDefault();
    if (window.ffToast) window.ffToast('🔒 Please sign up as a Food Donor to donate');
    if (typeof window.ffOpenSignupModal === 'function') {
      window.ffOpenSignupModal();
    } else {
      setTimeout(function () { window.location.href = 'index.html?signup=1'; }, 500);
    }
  });

})();
