<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Users | Admin | FeedFoodForward</title>
  <meta name="theme-color" content="#16a34a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    (function guardAdmin() {
      try {
        var _tabId = sessionStorage.getItem('ff_tab_id') || 'tab_fallback';
        var raw = localStorage.getItem('fff_current_user_' + _tabId);
        var user = raw ? JSON.parse(raw) : null;
        if (!user || user.role !== 'admin') { location.replace('admin-login.html'); }
      } catch (e) { location.replace('admin-login.html'); }
    })();
  </script>
</head>
<body>

<header class="site-header">
  <div class="header-container">
    <button type="button" class="hamburger-btn" id="hamburgerBtn" aria-label="Open menu">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <a href="admin-portal.html" class="brand-logo">
      <div class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="ffTileTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#067A54"/><stop offset="55%" stop-color="#0B9F6E"/><stop offset="100%" stop-color="#10B981"/></linearGradient>
            <linearGradient id="ffHeartTop" x1="0" y1="0" x2="0.5" y2="1"><stop offset="0%" stop-color="#FF5A7A"/><stop offset="100%" stop-color="#F03E64"/></linearGradient>
            <linearGradient id="ffLeafTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#A3E635"/><stop offset="100%" stop-color="#65A30D"/></linearGradient>
          </defs>
          <rect x="2" y="2" width="44" height="44" rx="11" fill="url(#ffTileTop)"/>
          <g transform="translate(28 6) rotate(20)"><path d="M0 14 C0 6 5 1 12 0 C12 8 7 14 0 14 Z" fill="url(#ffLeafTop)"/></g>
          <g transform="translate(8 20)"><path d="M10 20 C2 14 -1 10 -1 6 C-1 2.6 1.7 0.4 5 0.4 C7.4 0.4 9.2 1.8 10 3.4 C10.8 1.8 12.6 0.4 15 0.4 C18.3 0.4 21 2.6 21 6 C21 10 18 14 10 20 Z" fill="url(#ffHeartTop)"/></g>
        </svg>
      </div>
      <div class="brand-text"><span class="brand-title">FeedFood<span>Forward</span></span><span class="brand-subtitle">ADMIN PANEL</span></div>
    </a>
    
    <nav class="site-nav" id="site-nav"></nav>
    <div class="header-utilities">
      <div id="header-user" class="header-user-group">
        <button type="button" class="user-chip" id="user-chip"><span class="user-avatar" id="user-avatar">⚡</span><span class="user-name" id="user-name">Admin</span><span class="user-caret">▾</span></button>
      </div>
    </div>
  </div>
</header>

<!-- The sliding sidebar is injected automatically by sidebar.js -->
<main style="padding: 3rem 1.5rem 4rem; min-height: 80vh; max-width: 1200px; margin: 0 auto;">
  <section class="admin-section">
    <div class="section-title">
      <h2>Manage Users</h2>
      <p>Donors, Ashrams, and Drivers.</p>
    </div>

    <div class="admin-box" style="max-width:1100px; margin: 0 auto;">
      <div style="display:flex;gap:0.75rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem;">
        <input type="text" id="user-search" class="search-input" placeholder="Search by name or email..." style="flex:1;min-width:220px;">
        <select id="user-role-filter" class="role-dropdown" style="max-width:200px;">
          <option value="">All Roles</option>
          <option value="donor">Donors</option>
          <option value="ashram">Ashrams</option>
          <option value="driver">Drivers</option>
        </select>
      </div>

      <div style="overflow-x:auto;">
        <table class="leaderboard-table" style="min-width:640px;">
          <thead>
            <tr>
              <th>Name</th><th>Email</th><th>Role</th><th>Verified</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="users-tbody">
            <tr><td colspan="5" style="text-align:center;padding:1.5rem;color:#94a3b8;">⏳ Loading users…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="footer-container">
    <div class="footer-brand"><h3>FeedFoodForward</h3><p>"Rescue Food. Reduce Waste. Feed Communities."</p></div>
    <div class="footer-copyright">© 2026 FeedFoodForward Platform.</div>
  </div>
</footer>

<div id="ff-toast" style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120%);background:#0f172a;color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:all .3s ease;z-index:9999;"></div>

<script src="app.js"></script>
<script src="header-nav.js"></script>
<script src="sidebar.js"></script>
<script src="animations.js"></script>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const user = (window.ffAuth && window.ffAuth.getUser) ? window.ffAuth.getUser() : null;
  const esc = s => String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  if (user) {
    const n = document.getElementById('user-name');   if (n) n.textContent = user.name || 'Admin';
    const a = document.getElementById('user-avatar'); if (a) a.textContent = user.avatar || '⚡';
  }

  let ALL = [];

  async function load() {
    const tbody = document.getElementById('users-tbody');
    try {
      const r = await fetch('/api/admin/users', { headers: { 'x-user-email': user.email } });
      const data = await r.json();
      if (!data.ok) throw new Error(data.error || 'Failed');
      ALL = data.users || [];
      render();
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="5" style="color:#dc2626;padding:1rem;text-align:center;">⚠️ ${esc(err.message)}</td></tr>`;
    }
  }

  function render() {
    const tbody = document.getElementById('users-tbody');
    const q = (document.getElementById('user-search').value || '').toLowerCase().trim();
    const role = document.getElementById('user-role-filter').value;

    const filtered = ALL.filter(u => {
      if (role && u.role !== role) return false;
      if (q) {
        const hay = ((u.name || '') + ' ' + (u.email || '')).toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    if (!filtered.length) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:1.5rem;color:#94a3b8;">No users match.</td></tr>';
      return;
    }

    tbody.innerHTML = filtered.map(u => `
      <tr>
        <td><strong>${esc(u.name)}</strong></td>
        <td style="font-size:0.8rem;">${esc(u.email)}</td>
        <td><span class="badge verified">${esc(u.roleLabel || u.role)}</span></td>
        <td><span class="badge ${/pending/i.test(u.verified || '') ? 'demo' : 'verified'}">${esc(u.verified || '—')}</span></td>
        <td>
          <button type="button" class="btn btn-sm btn-success" data-verify="${esc(u._id)}" data-status="Verified">Approve</button>
          <button type="button" class="btn btn-sm btn-outline" data-verify="${esc(u._id)}" data-status="Rejected">Reject</button>
        </td>
      </tr>`).join('');

    tbody.querySelectorAll('[data-verify]').forEach(b => {
      b.addEventListener('click', async () => {
        b.disabled = true;
        try {
          const r = await fetch('/api/users/' + encodeURIComponent(b.dataset.verify) + '/verify', {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ verified: b.dataset.status })
          });
          const d = await r.json();
          if (!d.ok) throw new Error(d.error);
          if (window.ffToast) window.ffToast('✅ ' + b.dataset.status);
          load();
        } catch (err) {
          b.disabled = false;
          if (window.ffToast) window.ffToast('⚠️ ' + err.message);
        }
      });
    });
  }

  document.getElementById('user-search').addEventListener('input', render);
  document.getElementById('user-role-filter').addEventListener('change', render);

  load();
});
</script>

<style>
  /* HEAVY ANIMATION LAYER */
  body.admin-anim-active {
    opacity: 0;
    transition: opacity 0.8s ease;
    background: 
      radial-gradient(800px 600px at 10% 10%, rgba(16,185,129,0.08), transparent 60%),
      radial-gradient(800px 600px at 90% 90%, rgba(59,130,246,0.06), transparent 60%),
      radial-gradient(800px 600px at 50% 50%, rgba(245,158,11,0.04), transparent 60%),
      #f6f9fc;
    background-size: 200% 200%;
    animation: adminBgShift 15s ease-in-out infinite alternate;
  }
  body.admin-anim-active.admin-ready {
    opacity: 1;
  }
  @keyframes adminBgShift {
    0% { background-position: 0% 0%; }
    100% { background-position: 100% 100%; }
  }

  .admin-particle {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
    animation: adminFloatUp linear infinite;
  }
  @keyframes adminFloatUp {
    0% { transform: translateY(105vh) scale(0.4) rotate(0deg); opacity: 0; }
    10% { opacity: 0.7; }
    90% { opacity: 0.7; }
    100% { transform: translateY(-20vh) scale(1.2) rotate(360deg); opacity: 0; }
  }

  .admin-cursor-glow {
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(16,185,129,0.12), transparent 70%);
    transform: translate(-50%, -50%);
    filter: blur(40px);
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .admin-box, .impact-box, .section-title {
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.4s ease, border-color 0.4s ease;
    position: relative;
    z-index: 1;
    overflow: hidden;
  }
  .admin-box.admin-in, .impact-box.admin-in, .section-title.admin-in {
    opacity: 1;
    transform: none;
  }
  
  .admin-box::before {
    content: "";
    position: absolute;
    top: 0; left: -100%; width: 50%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(16,185,129,0.08), transparent);
    transform: skewX(-20deg);
    transition: left 0.7s ease;
    pointer-events: none;
  }
  .admin-box:hover::before {
    left: 200%;
  }
  .admin-box:hover {
    transform: translateY(-5px);
    border-color: #a7f3d0;
    box-shadow: 0 15px 35px -10px rgba(16,185,129,0.25);
  }

  .leaderboard-table tbody tr {
    opacity: 0;
    transform: translateX(-15px);
    transition: opacity 0.4s ease, transform 0.4s ease, background 0.3s ease;
  }
  .leaderboard-table tbody tr.row-in {
    opacity: 1;
    transform: none;
  }
  
  .leaderboard-table tbody tr {
    position: relative;
    cursor: pointer;
  }
  .leaderboard-table tbody tr::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0; width: 3px;
    background: #10b981;
    transform: scaleY(0);
    transform-origin: top;
    transition: transform 0.3s ease;
  }
  .leaderboard-table tbody tr:hover::before {
    transform: scaleY(1);
  }
  .leaderboard-table tbody tr:hover {
    background: #f0fdf4 !important;
    transform: translateX(4px);
  }

  .badge {
    position: relative;
    overflow: hidden;
  }
  .badge::after {
    content: "";
    position: absolute;
    top: 0; left: -100%; width: 50%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
    transform: skewX(-20deg);
    animation: badgeShine 3s infinite;
  }
  @keyframes badgeShine {
    0% { left: -100%; }
    20%, 100% { left: 200%; }
  }
  .badge.verified { animation: badgePulseGreen 2.5s infinite; }
  .badge.demo { animation: badgePulseRed 2.5s infinite; }
  @keyframes badgePulseGreen {
    0%, 100% { box-shadow: 0 0 0 0 rgba(16,185,129,0.4); }
    50% { box-shadow: 0 0 0 6px rgba(16,185,129,0); }
  }
  @keyframes badgePulseRed {
    0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.4); }
    50% { box-shadow: 0 0 0 6px rgba(239,68,68,0); }
  }
</style>

<script>
document.addEventListener('DOMContentLoaded', () => {
  'use strict';
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (!reducedMotion) {
    document.body.classList.add('admin-anim-active');
    requestAnimationFrame(() => document.body.classList.add('admin-ready'));

    const palette = [
      'radial-gradient(circle, rgba(16,185,129,0.4), transparent 70%)',
      'radial-gradient(circle, rgba(59,130,246,0.3), transparent 70%)',
      'radial-gradient(circle, rgba(245,158,11,0.3), transparent 70%)'
    ];
    for (let i = 0; i < 25; i++) {
      const p = document.createElement('div');
      p.className = 'admin-particle';
      p.style.left = (Math.random() * 100) + 'vw';
      p.style.width = p.style.height = (4 + Math.random() * 8) + 'px';
      p.style.background = palette[i % 3];
      p.style.animationDuration = (12 + Math.random() * 16) + 's';
      p.style.animationDelay = '-' + (Math.random() * 20) + 's';
      document.body.appendChild(p);
    }
  }

  if (!reducedMotion && window.matchMedia('(hover: hover) and (min-width: 1024px)').matches) {
    const glow = document.createElement('div');
    glow.className = 'admin-cursor-glow';
    document.body.appendChild(glow);
    let mouseX = 0, mouseY = 0, glowX = 0, glowY = 0;
    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX; mouseY = e.clientY;
      glow.style.opacity = '1';
    });
    document.addEventListener('mouseleave', () => { glow.style.opacity = '0'; });
    (function animateGlow() {
      glowX += (mouseX - glowX) * 0.15;
      glowY += (mouseY - glowY) * 0.15;
      glow.style.left = glowX + 'px';
      glow.style.top = glowY + 'px';
      requestAnimationFrame(animateGlow);
    })();
  }

  const revealEls = document.querySelectorAll('.admin-box, .impact-box, .section-title');
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver((entries) => {
      entries.forEach((entry, i) => {
        if (entry.isIntersecting) {
          setTimeout(() => { entry.target.classList.add('admin-in'); }, i * 60);
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -20px 0px' });
    revealEls.forEach(el => io.observe(el));
  } else {
    revealEls.forEach(el => el.classList.add('admin-in'));
  }

  function animateRows() {
    const rows = document.querySelectorAll('.leaderboard-table tbody tr');
    rows.forEach((row, i) => {
      if (!row.classList.contains('row-in')) {
        row.style.transitionDelay = (i * 40) + 'ms';
        row.classList.add('row-in');
      }
    });
  }

  setTimeout(animateRows, 300);

  const observer = new MutationObserver((mutations) => {
    mutations.forEach((m) => {
      if (m.addedNodes.length) animateRows();
    });
  });

  const targets = document.querySelectorAll('.leaderboard-table tbody');
  targets.forEach(t => observer.observe(t, { childList: true }));
});
</script>
</body>
</html>
