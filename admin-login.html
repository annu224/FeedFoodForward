<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | FeedFoodForward</title>
<meta name="theme-color" content="#0f172a">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2316a34a'/%3E%3Cpath d='M50 80 C28 62 18 50 18 37 A17 17 0 0 1 50 28 A17 17 0 0 1 82 37 C82 50 72 62 50 80 Z' fill='%23ffffff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.al { min-height: 100vh; display: grid; place-items: center; padding: 2rem 1.5rem;
      background: linear-gradient(135deg, #0B1224 0%, #1e293b 60%, #0f172a 100%);
      position: relative; overflow: hidden; }
.al-orb { position:absolute; border-radius:50%; filter:blur(90px); opacity:.45; pointer-events:none; }
.al-orb-1 { width:520px; height:520px; top:-180px; left:-150px;
  background: radial-gradient(circle, rgba(16,185,129,.4), transparent 70%); }
.al-orb-2 { width:460px; height:460px; bottom:-180px; right:-150px;
  background: radial-gradient(circle, rgba(245,158,11,.3), transparent 70%); }

.al-card { position:relative; z-index:1; width:100%; max-width:420px;
  background:#fff; border-radius:22px; overflow:hidden;
  box-shadow: 0 40px 90px -30px rgba(0,0,0,.6);
  animation: alIn .6s cubic-bezier(.2,.7,.2,1); }
@keyframes alIn { from { opacity:0; transform: translateY(24px) scale(.96); } to { opacity:1; transform:none; } }

.al-head { padding:2rem 2rem 1.5rem; text-align:center;
  background: linear-gradient(135deg, #0B1224 0%, #1e293b 100%); color:#fff; position:relative; overflow:hidden; }
.al-head::before { content:""; position:absolute; width:260px; height:260px; top:-120px; right:-80px;
  background: radial-gradient(circle, rgba(16,185,129,.35), transparent 65%); border-radius:50%; }
.al-badge { position:relative; z-index:1; display:inline-flex; align-items:center; gap:.5rem;
  padding:.4rem .9rem; background: rgba(16,185,129,.18); border:1px solid rgba(16,185,129,.35);
  border-radius:999px; font-size:.68rem; font-weight:800; letter-spacing:.14em; text-transform:uppercase;
  color:#6ee7b7; margin-bottom:1rem; }
.al-badge-dot { width:7px; height:7px; border-radius:50%; background:#10b981; position:relative; }
.al-badge-dot::after { content:""; position:absolute; inset:-4px; border-radius:50%;
  border:1.5px solid rgba(16,185,129,.5); animation: alPing 1.8s ease-out infinite; }
@keyframes alPing { 0% { transform: scale(1); opacity:1; } 100% { transform: scale(2); opacity:0; } }

.al-head h1 { position:relative; z-index:1; font-family:'Outfit',sans-serif;
  font-size:1.55rem; font-weight:800; letter-spacing:-.02em; margin:0 0 .35rem; }
.al-head p { position:relative; z-index:1; font-size:.85rem; color: rgba(255,255,255,.7); margin:0; }

.al-body { padding:2rem 2rem 2.25rem; }
.al-body .form-group { margin-bottom:1.1rem; }
.al-body label { display:block; font-size:.82rem; font-weight:700; color:#334155; margin-bottom:.4rem; }
.al-body input { width:100%; padding:.85rem 1rem; font-size:.92rem; font-family:inherit;
  border:1.5px solid #e2e8f0; border-radius:12px; background:#fff; color:#0f172a;
  transition: all .2s ease; box-sizing: border-box; }
.al-body input:focus { outline:none; border-color:#10b981; box-shadow: 0 0 0 4px rgba(16,185,129,.14); }

.al-row { display:flex; justify-content:space-between; align-items:center;
  gap:.5rem; margin:.4rem 0 1.25rem; font-size:.8rem; }
.al-check { display:inline-flex; align-items:center; gap:.4rem; color:#475569; font-weight:600; cursor:pointer; }
.al-check input { width:15px; height:15px; accent-color:#10b981; }
.al-link { background:none; border:none; padding:0; font-family:inherit;
  font-size:.8rem; font-weight:700; color:#047857; cursor:pointer; }
.al-link:hover { text-decoration:underline; }

.al-error { display:none; align-items:center; gap:.5rem; margin-bottom:1rem;
  padding:.85rem 1rem; background:#fef2f2; border:1px solid #fecaca; border-radius:12px;
  color:#991b1b; font-size:.82rem; font-weight:600; }
.al-error.show { display:flex; animation: alShake .4s ease; }
@keyframes alShake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }

.al-submit { width:100%; padding:1rem 1.5rem; font-family:inherit; font-size:.92rem; font-weight:800;
  background: linear-gradient(135deg, #047857, #10b981); color:#fff; border:none; border-radius:12px;
  cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:.55rem;
  box-shadow: 0 12px 28px -10px rgba(11,159,110,.55);
  transition: transform .2s ease, box-shadow .2s ease; }
.al-submit:hover:not(:disabled) { transform: translateY(-2px);
  box-shadow: 0 18px 34px -10px rgba(11,159,110,.7); }
.al-submit:disabled { opacity:.7; cursor:not-allowed; }

.al-foot { padding:1.15rem 2rem; background:#f8fafc; border-top:1px solid #e2e8f0;
  text-align:center; font-size:.78rem; color:#64748b; }
.al-foot a { color:#047857; font-weight:700; text-decoration:none; }
.al-foot a:hover { text-decoration:underline; }
</style>
</head>
<body>

<main class="al">
  <div class="al-orb al-orb-1"></div>
  <div class="al-orb al-orb-2"></div>

  <div class="al-card">
    <div class="al-head">
      <span class="al-badge"><span class="al-badge-dot"></span> Restricted Access</span>
      <h1>Admin Portal Login</h1>
      <p>Authorized personnel only</p>
    </div>

    <div class="al-body">
      <div class="al-error" id="al-error">
        <span>⚠️</span>
        <span id="al-error-text">Please check your credentials.</span>
      </div>

      <form id="al-form" onsubmit="return false;" novalidate>
        <div class="form-group">
          <label for="al-email">Admin Email</label>
          <input type="email" id="al-email" placeholder="admin@feedfoodforward.demo"
                 autocomplete="username" required>
        </div>

        <div class="form-group">
          <label for="al-password">Password</label>
          <input type="password" id="al-password" placeholder="Enter your password"
                 autocomplete="current-password" required>
        </div>

        <div class="al-row">
          <label class="al-check">
            <input type="checkbox" id="al-remember">
            <span>Remember me</span>
          </label>
          <button type="button" class="al-link" id="al-forgot">Forgot password?</button>
        </div>

        <button type="submit" class="al-submit" id="al-submit-btn">
          🔐 Login to Admin Dashboard
        </button>
      </form>
    </div>

    <div class="al-foot">
      Not an admin? <a href="index.html?login=1">Regular login</a>
    </div>
  </div>
</main>

<script>
document.addEventListener('DOMContentLoaded', () => {
  'use strict';

  const form      = document.getElementById('al-form');
  const emailEl   = document.getElementById('al-email');
  const pwEl      = document.getElementById('al-password');
  const submitBtn = document.getElementById('al-submit-btn');
  const errorEl   = document.getElementById('al-error');
  const errorText = document.getElementById('al-error-text');
  const forgotBtn = document.getElementById('al-forgot');

  function showError(msg) {
    errorText.textContent = msg;
    errorEl.classList.remove('show');
    void errorEl.offsetWidth;
    errorEl.classList.add('show');
  }
  function hideError() { errorEl.classList.remove('show'); }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideError();

    const email = (emailEl.value || '').trim().toLowerCase();
    const pw    = pwEl.value || '';

    if (!email || !email.includes('@')) { showError('Please enter a valid admin email.'); return; }
    if (!pw || pw.length < 4) { showError('Please enter your password.'); return; }

    submitBtn.disabled = true;
    submitBtn.textContent = '⏳ Verifying…';

    try {
      const r = await fetch('/api/auth/admin-login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password: pw })
      });

      const ct = r.headers.get('content-type') || '';
      if (!ct.includes('application/json')) {
        throw new Error('Server did not return JSON (HTTP ' + r.status + ').');
      }

      const data = await r.json();

      if (!r.ok || !data.ok) {
        showError(data.error || 'Invalid admin credentials.');
        submitBtn.disabled = false;
        submitBtn.textContent = '🔐 Login to Admin Dashboard';
        return;
      }

      /* Save session using per-tab scoped key */
      try {
        var _tabId = sessionStorage.getItem('ff_tab_id');
        if (!_tabId) {
          _tabId = 'tab_' + Math.random().toString(36).slice(2, 10);
          sessionStorage.setItem('ff_tab_id', _tabId);
        }
        localStorage.setItem('fff_current_user_' + _tabId, JSON.stringify(data.user));
        sessionStorage.setItem('ff_persona', 'admin');
      } catch (err) {}

      window.location.href = 'admin-portal.html';

    } catch (err) {
      showError('⚠️ ' + err.message);
      submitBtn.disabled = false;
      submitBtn.textContent = '🔐 Login to Admin Dashboard';
    }
  });

  forgotBtn.addEventListener('click', () => {
    showError('Password reset for admin accounts is handled by the platform owner. Contact support@feedfoodforward.demo.');
  });
});
</script>

  /* 3. CARD & BOX ANIMATIONS */

    position: relative;

  .admin-box.admin-in, .impact-box.admin-in, .section-title.admin-in {

  /* Card Glowing Border Sweep */
  .admin-box::before {

    background: linear-gradient(90deg, transparent, rgba(16,185,129,0.08), transparent);

  .leaderboard-table tbody tr {

  .leaderboard-table tbody tr::before {

  .badge::after {

    transform: skewX(-20deg);

  @keyframes badgePulseGreen {

  @keyframes badgePulseRed {

</style>

<script>
document.addEventListener('DOMContentLoaded', () => {
  'use strict';
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // 1. Page Entrance
  if (!reducedMotion) {
    document.body.classList.add('admin-anim-active');
    requestAnimationFrame(() => document.body.classList.add('admin-ready'));
  }

  // 2. Spawn Floating Particles
  if (!reducedMotion) {
    const palette = [
      'radial-gradient(circle, rgba(16,185,129,0.4), transparent 70%)',
      'radial-gradient(circle, rgba(59,130,246,0.3), transparent 70%)',
      'radial-gradient(circle, rgba(245,158,11,0.3), transparent 70%)'
    ];
    for (let i = 0; i < 25; i++) {
      const p = document.createElement('div');
      p.className = 'admin-particle';
      p.style.left = (Math.random() * 100) + 'vw';
      p.style.width = p.style.height = (4 + Math.random() * 8) + 'px';
      p.style.background = palette[i % 3];
      p.style.animationDuration = (12 + Math.random() * 16) + 's';
      p.style.animationDelay = '-' + (Math.random() * 20) + 's';
      document.body.appendChild(p);
    }
  }

  // 3. Cursor Glow
  if (!reducedMotion && window.matchMedia('(hover: hover) and (min-width: 1024px)').matches) {
    const glow = document.createElement('div');
    glow.className = 'admin-cursor-glow';
    document.body.appendChild(glow);
    let mouseX = 0, mouseY = 0, glowX = 0, glowY = 0;
    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX; mouseY = e.clientY;
      glow.style.opacity = '1';
    });
    document.addEventListener('mouseleave', () => { glow.style.opacity = '0'; });
    (function animateGlow() {
      glowX += (mouseX - glowX) * 0.15;
      glowY += (mouseY - glowY) * 0.15;
      glow.style.left = glowX + 'px';
      glow.style.top = glowY + 'px';
      requestAnimationFrame(animateGlow);
    })();
  }

  // 4. Scroll Reveal for Admin Boxes & Stats
  const revealEls = document.querySelectorAll('.admin-box, .impact-box, .section-title');
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver((entries) => {
      entries.forEach((entry, i) => {
        if (entry.isIntersecting) {
          setTimeout(() => {
            entry.target.classList.add('admin-in');
          }, i * 60);
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -20px 0px' });
    revealEls.forEach(el => io.observe(el));
  } else {
    revealEls.forEach(el => el.classList.add('admin-in'));
  }

  // 5. Animate Table Rows & Delivery Cards
  function animateRows() {
    const rows = document.querySelectorAll('.leaderboard-table tbody tr');
    rows.forEach((row, i) => {
      if (!row.classList.contains('row-in')) {
        row.style.transitionDelay = (i * 40) + 'ms';
        row.classList.add('row-in');
      }
    });

    const dlvCards = document.querySelectorAll('#dlv-list > div');
    dlvCards.forEach((card, i) => {
      if (!card.classList.contains('dlv-in')) {
        card.style.transitionDelay = (i * 50) + 'ms';
        card.classList.add('dlv-in');
      }
    });
  }

  setTimeout(animateRows, 300);

  // Listen for dynamic updates (e.g. when fetch() loads new data)
  const observer = new MutationObserver((mutations) => {
    mutations.forEach((m) => {
      if (m.addedNodes.length) animateRows();
    });
  });

  const targets = document.querySelectorAll('#users-tbody, #drivers-tbody, #dlv-list, #r-top-donors, #r-top-ashrams, #don-tbody');
  targets.forEach(t => observer.observe(t, { childList: true }));
});
</script>
